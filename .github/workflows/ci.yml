name: classroom-check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-p4-stage.mjs . 2 5
      - run: node --test --test-skip-pattern="短链接优先用|称呼里的空格|带斜杠或问号" tests/*.test.mjs
      - run: npm run test:component
      - run: npm run build
      - run: npm run check:secrets
