name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personalink_test
          POSTGRES_USER: personalink
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalink -d personalink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personalink:ci-only-password@127.0.0.1:5432/personalink_test
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
      AUTO_SEED: "0"
      POSTGRES_DB: personalink
      POSTGRES_USER: personalink
      POSTGRES_PASSWORD: compose-validation-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate operational scripts
        run: |
          bash -n scripts/*.sh
          backup_env="$(mktemp)"
          trap 'rm -f "$backup_env"' EXIT
          printf 'BACKUP_ENCRYPTION_PASSWORD=ci-export-check\nOFFSITE_REMOTE=\n' > "$backup_env"
          BACKUP_ENV_FILE="$backup_env" bash -c \
            'source scripts/common.sh; test "$(printenv BACKUP_ENCRYPTION_PASSWORD)" = "ci-export-check"'

      - name: Prepare Compose environment
        run: |
          cp .env.example .env
          sed -i 's|replace-with-a-long-random-password|compose-validation-only|' .env
          sed -i 's|replace-with-at-least-32-random-characters|ci-only-jwt-secret-with-more-than-32-characters|' .env
          sed -i 's|replace-before-the-first-start|ci-admin-password-123|' .env
          sed -i 's|https://app.example.com|https://ci.example.test|' .env

      - name: Validate Compose model
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Build production images
        run: docker compose -f compose.yaml -f compose.prod.yaml build

      - name: Smoke test production stack
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml up -d
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.yaml -f compose.prod.yaml ps
              docker compose -f compose.yaml -f compose.prod.yaml logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            --data '{"email":"admin@system.com","password":"ci-admin-password-123"}' \
            http://127.0.0.1:3100/api/users/login | grep -q '"token"'

      - name: Stop production stack
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml down --volumes
