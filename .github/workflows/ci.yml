name: classroom-check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/adapter.test.mjs tests/failover.test.mjs tests/lyrics.test.mjs tests/playmode.test.mjs
      - run: npm run test:component
        env:
          P5_LESSON: '1'
          P5_STAGE: '4'
      - run: npm run build
