name: personalink

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
            # ======== 第15课 TODO 04（简单）：数据库名称和账号也从 .env 读（密码已接好） ========
      # 【修改边界】只改本任务注释指定的占位代码；保留函数、路由、选择器等外层结构，也不要提前修改其他课次 TODO。
      # 【动手顺序】先逐条读要求，把每条要求写成一个条件或一条语句；再按注释给出的顺序组合，不要凭感觉一次写一大段。
      # 【完成标准】保存后执行本课手册该 TODO 的“自己验证”；结果、状态码或页面效果全部一致才算完成，卡住再对照本课教师答案。
      # compose.yaml 是要进 Git 的，**密码绝对不能写在里面**。
      #
      # 终端里看得到的结果：docker compose config 能看到密码被替换成了
      # .env 里的真实值，但 compose.yaml 本身里只有占位符。
      #
      # 密码从起点就读取 .env，避免前面任务因凭据不一致而启动失败。
      # 本项把 POSTGRES_DB 和 POSTGRES_USER 也改成对应环境变量，密码这一行保留。
      #
      # Compose 未加引号的值中，空格后的 # 才开始行内注释。
      # Abc#2026 不会截断；Abc #说明 的值才是 Abc。
      # 需要按字面保留含 $ 等字符的值时可用单引号。密钥优先使用随机 base64url。
      # ======================================================
      POSTGRES_DB: personalink
      POSTGRES_USER: personalink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        # ======== 第15课 TODO 01（极简单）：给数据库加上持久卷（健康检查已提供） ========
    # 【修改边界】只改本任务注释指定的占位代码；保留函数、路由、选择器等外层结构，也不要提前修改其他课次 TODO。
    # 【动手顺序】先逐条读要求，把每条要求写成一个条件或一条语句；再按注释给出的顺序组合，不要凭感觉一次写一大段。
    # 【完成标准】保存后执行本课手册该 TODO 的“自己验证”；结果、状态码或页面效果全部一致才算完成，卡住再对照本课教师答案。
    # **容器是用完即弃的。** 删掉重建之后，容器里写的东西全没了。
    # 数据库的数据必须放在**卷（volume）**里，卷独立于容器存在。
    #
    # 终端里看得到的结果：docker compose down 再 up，
    # **数据还在**；不要运行 down -v，它会删除数据卷。
    # 用保留数据的重建验证持久化，不要求破坏性对照实验。
    #
    # TODO：补上命名卷挂载，保留下方已有健康检查。讲读两部分：
    #   1) volumes: 把 postgres_data 挂到 /var/lib/postgresql/data
    #      （这是 PostgreSQL 存数据的目录）
    #   2) healthcheck: 用 pg_isready 定期检查数据库活没活
    #
    # 健康检查为什么重要：后端容器启动比数据库快，
    # 它一上来就连数据库会连不上直接崩。
    # 有了健康检查，后端可以配 depends_on: condition: service_healthy，
    # **等数据库真正就绪了再启动**。
    # ========================================================
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3003
    volumes:
      - ./data/uploads:/app/uploads
      - ./logs:/app/logs
        # ======== 第15课 TODO 02（简单）：让后端等数据库真正就绪 ========
    # 【修改边界】只改本任务注释指定的占位代码；保留函数、路由、选择器等外层结构，也不要提前修改其他课次 TODO。
    # 【动手顺序】先逐条读要求，把每条要求写成一个条件或一条语句；再按注释给出的顺序组合，不要凭感觉一次写一大段。
    # 【完成标准】保存后执行本课手册该 TODO 的“自己验证”；结果、状态码或页面效果全部一致才算完成，卡住再对照本课教师答案。
    # 终端里看得到的结果：docker compose up 时，
    # 后端容器会**等着**，直到数据库健康检查通过才启动，
    # 而不是一上来就报"连接被拒绝"然后反复重启。
    #
    # 本任务要补全：补上依赖声明
    #   depends_on:
    #     postgres:
    #       condition: service_healthy
    #
    # 注意 depends_on **单独写只保证启动顺序，不保证"能用了"**。
    # 容器起来了不等于里面的数据库初始化完了。
    # 必须配合 TODO 01 的 healthcheck 加上 condition，才是真的等就绪。
    # 这是 Docker Compose 里最常被误解的一个点。
    # ================================================
    networks: [internal]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    ports:
            # ======== 第15课 TODO 03（简单）：端口只开给本机 ========
      # 【修改边界】只改本任务注释指定的占位代码；保留函数、路由、选择器等外层结构，也不要提前修改其他课次 TODO。
      # 【动手顺序】先逐条读要求，把每条要求写成一个条件或一条语句；再按注释给出的顺序组合，不要凭感觉一次写一大段。
      # 【完成标准】保存后执行本课手册该 TODO 的“自己验证”；结果、状态码或页面效果全部一致才算完成，卡住再对照本课教师答案。
      # 终端里看得到的结果：在服务器上 curl 127.0.0.1:3100 能通，
      # 但从外网直接访问这个端口**连不上**。
      #
      # 本任务要补全：把端口映射写成 "127.0.0.1:${FRONTEND_PORT:-3100}:80"
      #
      # 前面加 127.0.0.1 的意思是"**只绑定本机回环地址**"。
      # 不加的话默认绑到 0.0.0.0，也就是**对整个互联网开放**——
      # 这是容器化部署里最常见的一个安全事故：
      # 有人以为有防火墙就安全了，但 Docker 会自己改 iptables 规则，
      # 把端口直接捅到公网上。
      #
      # 那外网怎么访问？由宿主机上的 Nginx 反向代理转发进来，
      # Nginx 负责 HTTPS、限流和安全响应头。
      # ========================================
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: personalink_postgres_data
