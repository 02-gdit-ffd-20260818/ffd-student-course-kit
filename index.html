<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

    <title>星声音乐站 · 课堂点歌台</title>
    <meta name="description" content="星声音乐站：多音源自动容错的课堂点歌队列，支持歌词同步、主持控制与合规来源标注。" />

    <!-- 标签页图标。用 SVG 而不是 .ico：一个文件适配所有尺寸，
         而且在深色标签栏下也不会糊。老浏览器认不出 SVG 时会退回 emoji 那一行。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2f4a7a" />

    <!-- 手机上浏览器地址栏会跟着这个颜色走，深浅色各给一个 -->
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)" />

    <!-- 分享到聊天软件时的预览 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="星声音乐站 · 课堂点歌台" />
    <meta property="og:description" content="多音源自动容错、歌词逐句同步、主持人可控的课堂点歌队列。" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
