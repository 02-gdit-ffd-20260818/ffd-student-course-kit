# PersonaLink Nginx 统一配置
# ============================================================================
# 本文件同时支持两种访问方式：域名访问和固定公网 IP 访问。
#
# 方式一：域名部署
#   1. 将 server_name 中的 example.com 改成真实域名，例如：personalink.com。
#   2. 确保域名的 DNS A 记录指向服务器公网 IP。
#   3. 如果启用了 HTTPS，还需要额外配置 443 端口和 SSL 证书。
#
# 方式二：固定公网 IP 部署
#   1. 将 server_name 中的 203.0.113.10 改成服务器真实公网 IP。
#   2. 不需要购买域名，但用户需要通过 http://公网IP 访问。
#   3. 没有域名时通常不能直接申请常规 HTTPS 证书，教学环境可先使用 HTTP。
#
# 两种方式的区别只有访问地址不同，前端静态文件、后端 API 代理和路由处理完全相同。
# 如果只使用其中一种方式，可以从 server_name 中删除另一项。
# ============================================================================
#
# 部署前准备：
#   前端：cd frontend && npm ci && npm run build
#   后端：cd backend && npm ci && npm start
#
# 请把 root 修改为服务器上 frontend/dist 的真实绝对路径。

server {
    # HTTP 默认端口。生产环境使用 HTTPS 时，还应另行配置 listen 443 ssl。
    listen 80;
    listen [::]:80;

    # 域名部署示例：example.com
    # IP 部署示例：203.0.113.10
    # 可以同时保留二者；Nginx 会根据请求中的 Host 自动匹配。
    server_name example.com 203.0.113.10;

    # Vite 构建输出目录，不能指向 frontend/src 或 frontend/public。
    # 如果项目部署在 /var/www/personalink，请保持此路径；否则替换为实际路径。
    root /var/www/personalink/frontend/dist;
    index index.html;

    # Vue Router 使用 history 模式。
    # 直接访问 /home、/profile、/search 等地址时，服务器没有对应实体文件，
    # 因此回退到 index.html，由前端路由负责显示正确页面，避免刷新出现 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理。
    # 浏览器请求 /api/users/login 时，Nginx 转发到本机 Express 的 3003 端口。
    # proxy_pass 不附加路径，能够完整保留 /api 前缀，与 backend/server.js 的
    # app.use('/api/users', ...) 等路由保持一致。
    location /api/ {
        proxy_pass http://127.0.0.1:3003;

        # 转发原始请求信息，方便后端读取域名、IP 和协议。
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后端 body-parser 的 10mb 限制保持一致。
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite 输出的 JS/CSS 文件名带 hash，文件内容变化时文件名也会变化，
    # 所以可以长期缓存，减少重复下载。
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public 目录中的图片和字体文件名通常不带 hash，使用 7 天缓存，
    # 便于替换资源后较快生效。
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
